<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>ポット計算</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
<header class="top"><div><h1>♠ ポット計算</h1><p>オールイン / メインポット / サイドポット</p></div><span class="pill">OFFLINE</span></header>
<section class="card">
 <div class="cardhead"><strong>プレイヤー入力</strong><span id="count" class="sub">4人</span></div>
 <div id="players"></div>
 <button class="add" id="add" type="button">＋ プレイヤーを追加</button>
 <p class="note">投入額は、このハンドで各プレイヤーが合計いくら出したかを入力してください。フォールドした人のチップもポットに含まれます。</p>
</section>
<button class="primary" id="calc" type="button">ポットを計算する</button>
<section class="card">
 <div class="cardhead"><strong>計算結果</strong></div>
 <div class="summary">
  <div class="stat"><small>総投入額</small><strong id="total">0</strong></div>
  <div class="stat"><small>ポット合計</small><strong id="potTotal">0</strong></div>
 </div>
 <div id="results" aria-live="polite"><p class="note">投入額を入力すると、ポットの内訳が表示されます。</p></div>
</section>
<div class="actions"><button class="secondary" id="reset" type="button">入力をリセット</button><button class="secondary" id="example" type="button">例を入力</button></div>
<footer>入力内容は保存・送信されません。チップ処理はテーブルルールと実際のアクションを確認してください。</footer>
</main>
<script src="./app.js" defer></script>
</body></html>
